  name: Spring Boot CI Pipeline

  on:
    push:
      branches:
        - main

  jobs:

    build:

      runs-on: ubuntu-latest

      steps:

        # Checkout code
        - name: Checkout Code
          uses: actions/checkout@v4

        # Setup Java
        - name: Setup Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 17

        # Cache Maven dependencies
        - name: Cache Maven Packages
          uses: actions/cache@v4
          with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

        # Build + Tests + JaCoCo + OWASP
        - name: Build Application
          run: mvn clean verify

        # Build Docker Image
        - name: Build Docker Image
          run: docker build -t helloworld-app .

        # DockerHub Login
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # Tag Docker Image
        - name: Tag Docker Image
          run: docker tag helloworld-app ${{ secrets.DOCKER_USERNAME }}/helloworld-app:v1

        # Push Docker Image
        - name: Push Docker Image
          run: docker push ${{ secrets.DOCKER_USERNAME }}/helloworld-app:v1
